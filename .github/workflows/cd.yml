name: Continuous Delivery

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: crazy-max/ghaction-upx@v4
        with:
          version: latest
      - run: pip install pyinstaller pillow
      - run: pyinstaller CacheEraser.spec
      - uses: actions/upload-artifact@v7
        with:
          name: CacheEraser-exe
          path: dist/CacheEraser.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CacheEraser-exe
          path: dist/
      - name: Generate tag
        id: tag
        shell: bash
        run: echo "tag=v$(date +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Cache Eraser ${{ steps.tag.outputs.tag }}
          body: |
            Автоматическая сборка от ${{ github.event.head_commit.message }}

            Коммит: ${{ github.sha }}
          files: dist/CacheEraser.exe

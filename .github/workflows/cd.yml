name: Continuous Delivery

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --cov=cache_eraser --cov-fail-under=85

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368 # v4
        with:
          version: latest
      - run: pip install -r requirements-build.txt
      - run: pyinstaller CacheEraser.spec
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CacheEraser-exe
          path: dist/CacheEraser.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: CacheEraser-exe
          path: dist/
      - name: Create checksum
        shell: bash
        run: cd dist && sha256sum CacheEraser.exe > CacheEraser.exe.sha256
      - uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3
        with:
          tag_name: ${{ inputs.version }}
          name: Cache Eraser ${{ inputs.version }}
          body: |
            Сборка Cache Eraser ${{ inputs.version }}

            Коммит: ${{ github.sha }}
            SHA256: см. CacheEraser.exe.sha256
          files: |
            dist/CacheEraser.exe
            dist/CacheEraser.exe.sha256

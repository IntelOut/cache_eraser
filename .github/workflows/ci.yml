name: Continuous Integration

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff mypy pylint
      - run: ruff check .
      - run: mypy --ignore-missing-imports cache_patterns.py scanner.py main.py
      - run: pylint cache_patterns.py scanner.py main.py tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov
      - run: python -m pytest --cov=cache_patterns --cov=scanner --cov-fail-under=70 -v

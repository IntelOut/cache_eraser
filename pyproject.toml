[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["cache_eraser", "main.py", "cache_patterns.py", "scanner.py", "tests"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["cache_eraser"]
omit = ["cache_eraser/ui.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
